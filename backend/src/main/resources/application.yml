server:
  port: ${SCIC_SERVER_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: scic-platform-backend
  datasource:
    url: ${SCIC_DB_URL:jdbc:h2:file:../.data/h2/scic;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${SCIC_DB_USER:sa}
    password: ${SCIC_DB_PASSWORD:}
    driver-class-name: ${SCIC_DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

scic:
  jwt:
    secret: ${SCIC_JWT_SECRET:change-this-demo-secret-before-production-2026}
    expiration-seconds: ${SCIC_JWT_EXPIRATION_SECONDS:28800}
  ai:
    base-url: ${SCIC_AI_BASE_URL:http://127.0.0.1:8001}
    service-token: ${SCIC_AI_SERVICE_TOKEN:local-ai-service-token-change-me}
    connect-timeout-ms: ${SCIC_AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SCIC_AI_READ_TIMEOUT_MS:15000}
  cors:
    allowed-origins: ${SCIC_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.scic.platform: INFO
  file:
    name: ${SCIC_LOG_FILE:../.data/logs/backend.log}

